{% extends "base.html" %} {% block content %}

<div class="container">
  <!-- Cabeçalho -->
  <section class="p-5 mb-4 theme-card rounded-3 shadow-sm">
    <a href="{% url 'configuracoes' %}" class="text-decoration-none small fw-bold">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar a todas as configurações
    </a>

    <h2 class="fw-bold theme-text mt-2">
      <i class="fa-solid fa-sliders me-2"></i>
      Preferências
    </h2>

    <p class="theme-muted mb-0">Personalize sua experiência de uso do Arsenal.</p>
  </section>

  <!-- Formulário de preferências -->
  <form method="POST">
    {% csrf_token %}

    <section>
      <div class="row g-4">
        <!-- =================================================
             APARÊNCIA
        ================================================== -->

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm p-4 h-100">
            <h4 class="fw-bold mb-4">
              <i class="fa-solid fa-palette me-2 text-primary"></i>
              Aparência
            </h4>

            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                id="darkModeSwitch"
                name="tema_escuro"
                {%
                if
                perfil.tema_escuro
                %}checked{%
                endif
                %}
              />

              <label class="form-check-label" for="darkModeSwitch"> Tema escuro </label>
            </div>
          </div>
        </div>

        <!-- =================================================
             NOTIFICAÇÕES
        ================================================== -->

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm p-4 h-100">
            <h4 class="fw-bold mb-4">
              <i class="fa-solid fa-bell me-2 text-warning"></i>
              Notificações
            </h4>

            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="email" name="notificacoes_email" />

              <label class="form-check-label" for="email"> Receber notificações por e-mail </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="sistema" name="notificacoes_sistema" />

              <label class="form-check-label" for="sistema"> Receber notificações no sistema </label>
            </div>
          </div>
        </div>

        <!-- =================================================
             PROCESSOS
        ================================================== -->

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm p-4 h-100">
            <h4 class="fw-bold mb-4">
              <i class="fa-solid fa-folder-open me-2 text-success"></i>
              Processos
            </h4>

            <label for="processosPorPagina" class="form-label"> Processos por página </label>

            <select class="form-select" id="processosPorPagina" name="processos_por_pagina">
              <option value="5">5</option>

              <option value="10">10</option>

              <option value="15">15</option>

              <option value="20">20</option>
            </select>
          </div>
        </div>

        <!-- =================================================
             INTELIGÊNCIA ARTIFICIAL
        ================================================== -->

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm p-4 h-100">
            <h4 class="fw-bold mb-4">
              <i class="fa-solid fa-robot me-2 text-danger"></i>
              Inteligência Artificial
            </h4>

            <label for="modeloIA" class="form-label"> Modelo padrão </label>

            <select class="form-select" id="modeloIA" name="modelo_ia">
              <option value="gpt-5.5">GPT-5.5</option>

              <option value="gpt-5.5-mini">GPT-5.5 Mini</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- =================================================
         BOTÃO SALVAR
    ================================================== -->

    <div class="text-end mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-floppy-disk me-2"></i>

        Salvar preferências
      </button>
    </div>
  </form>
</div>

{% endblock %}
