{% extends "baselogin.html" %}

{% block content %}

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-lg theme-card" style="max-width:450px; width:100%;">
      <div class="card-body p-5">

        <div class="text-center mb-4">
          <i class="fa-solid fa-shield-halved fa-3x text-primary mb-3"></i>
          <h2 class="fw-bold theme-text">
            Arsenal
          </h2>
          <p class="theme-muted mb-0">
            Sistema de Gestão de Processos
          </p>
        </div>

        {% if erro %}
          <div class="alert alert-danger small" role="alert">
            Usuário ou senha incorretos.
          </div>
        {% endif %}

        <!-- Login -->
        <form method="POST">
          {% csrf_token %}

          <!-- Usuário -->
          <div class="mb-3">
            <label
              for="username"
              class="form-label fw-semibold theme-text"
            >
              Usuário
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="fa-solid fa-user"></i>
              </span>

              <input
                type="text"
                name="username"
                id="username"
                class="form-control"
                placeholder="Digite seu usuário"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <!-- Senha -->
          <div class="mb-4">
            <label
              for="password"
              class="form-label fw-semibold theme-text"
            >
              Senha
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="fa-solid fa-lock"></i>
              </span>

              <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <!-- Botão -->
          <button
            type="submit"
            class="btn btn-primary w-100 py-2 fw-semibold"
          >
            <i class="fa-solid fa-right-to-bracket me-2"></i>
            Entrar
          </button>
        </form>

      </div>
    </div>
  </div>

{% endblock %}
