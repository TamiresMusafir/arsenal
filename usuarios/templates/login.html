{% load static %}

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | StudentHub</title>

    <!-- Bootstrap 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <main
      class="min-vh-100 d-flex align-items-center justify-content-center bg-body"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm p-4 p-md-5">
              <!-- Logo -->
              <div class="text-center mb-4">
                <div
                  class="topbar-title-icon mx-auto mb-3"
                  style="width: 60px; height: 60px"
                >
                  <i class="fa-solid fa-graduation-cap fs-4"></i>
                </div>

                <h1 class="h3 fw-bold theme-text mb-2">StudentHub</h1>

                <p class="theme-muted mb-0">Seu espaço acadêmico</p>
              </div>

              <!-- Título -->
              <div class="mb-4">
                <h2 class="h5 fw-bold theme-text">Entrar</h2>

                <p class="theme-muted small mb-0">
                  Acesse sua conta para continuar.
                </p>
              </div>

              <!-- Erro -->
              {% if erro %}
              <div class="alert alert-danger small" role="alert">
                Usuário ou senha incorretos.
              </div>
              {% endif %}

              <!-- Login -->
              <form method="POST">
                {% csrf_token %}

                <!-- Usuário -->
                <div class="mb-3">
                  <label
                    for="username"
                    class="form-label fw-semibold theme-text"
                  >
                    Usuário
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-solid fa-user"></i>
                    </span>

                    <input
                      type="text"
                      name="username"
                      id="username"
                      class="form-control"
                      placeholder="Digite seu usuário"
                      autocomplete="username"
                      required
                    />
                  </div>
                </div>

                <!-- Senha -->
                <div class="mb-4">
                  <label
                    for="password"
                    class="form-label fw-semibold theme-text"
                  >
                    Senha
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                      type="password"
                      name="password"
                      id="password"
                      class="form-control"
                      placeholder="Digite sua senha"
                      autocomplete="current-password"
                      required
                    />
                  </div>
                </div>

                <!-- Botão -->
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                >
                  <i class="fa-solid fa-right-to-bracket me-2"></i>
                  Entrar
                </button>
              </form>

              <!-- Rodapé -->
              <div class="text-center mt-4">
                <small class="theme-muted">
                  StudentHub · Seu espaço acadêmico
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
